<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f23">
    <title>CS Calendar - By Rafsan</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/moon-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Hind+Siliguri:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #c084fc;
            --secondary: #818cf8;
            --accent: #f472b6;
            --dark: #0f0f23;
            --darker: #0a0a1a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #e2e8f0;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background: var(--darker);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        /* Animated Starry Background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        .moon-glow {
            position: fixed;
            top: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(192, 132, 252, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: moonPulse 8s ease-in-out infinite;
        }

        @keyframes moonPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        /* Main Container */
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header & Logo */
        .header {
            text-align: center;
            padding: 20px 0 30px;
        }

        .logo {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            font-size: 48px;
            color: var(--primary);
            animation: float 3s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(192, 132, 252, 0.5);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .logo-text {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 4px;
        }

        .logo-sub {
            font-size: 14px;
            color: var(--text-dim);
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        .by-rafsan {
            font-size: 12px;
            color: var(--accent);
            letter-spacing: 3px;
            margin-top: 4px;
            font-weight: 600;
        }

        /* Navigation */
        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 10px 24px;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            color: var(--text);
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .nav-btn:hover, .nav-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: transparent;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(192, 132, 252, 0.3);
        }

        /* Date Display */
        .date-display {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .date-main {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .date-sub {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .date-item {
            text-align: center;
        }

        .date-item .label {
            font-size: 10px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .date-item .value {
            font-size: 18px;
            font-weight: 600;
            margin-top: 4px;
        }

        .date-item.bangla {
            font-family: 'Hind Siliguri', sans-serif;
        }

        .date-item.arabic {
            font-family: 'Noto Naskh Arabic', serif;
            direction: rtl;
        }

        /* Year Selector */
        .year-selector {
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .year-selector select {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            cursor: pointer;
            outline: none;
        }

        .year-selector select option {
            background: var(--dark);
        }

        /* Calendar Grid */
        .calendar-wrapper {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 25px;
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
            width: 100%;
            overflow: hidden;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .month-year {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .nav-arrows {
            display: flex;
            gap: 10px;
        }

        .arrow-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .arrow-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: scale(1.1);
        }

        /* Weekdays */
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 10px;
            width: 100%;
        }

        .weekday {
            text-align: center;
            padding: 12px 5px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .weekday.holiday {
            color: var(--accent);
        }

        /* Days Grid */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            width: 100%;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            padding: 5px;
            min-width: 0;
            overflow: hidden;
        }

        .day-cell:hover {
            background: rgba(192, 132, 252, 0.1);
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(192, 132, 252, 0.15);
        }

        .day-cell.today {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 4px 20px rgba(192, 132, 252, 0.4);
        }

        .day-cell.holiday {
            border-color: var(--accent);
            background: rgba(244, 114, 182, 0.08);
        }

        .day-cell.holiday .day-num {
            color: var(--accent);
            font-weight: 700;
        }

        .day-cell.other-month {
            opacity: 0.3;
        }

        .day-cell.selected {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.3);
        }

        .day-num {
            font-size: 18px;
            font-weight: 600;
            line-height: 1;
        }

        .day-sub {
            font-size: 9px;
            color: var(--text-dim);
            margin-top: 2px;
            font-family: 'Hind Siliguri', sans-serif;
            line-height: 1;
            white-space: nowrap;
        }

        .day-sub.ar {
            font-family: 'Noto Naskh Arabic', serif;
        }

        .holiday-badge {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
        }

        /* Weekly View */
        .weekly-view {
            display: none;
        }

        .week-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .week-day-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px 10px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .week-day-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .week-day-card.holiday {
            border-color: var(--accent);
            background: rgba(244, 114, 182, 0.05);
        }

        .week-day-card.today {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: transparent;
        }

        .week-day-name {
            font-size: 12px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .week-day-num {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .week-day-sub {
            font-size: 11px;
            color: var(--text-dim);
            font-family: 'Hind Siliguri', sans-serif;
        }

        .week-day-sub.ar {
            font-family: 'Noto Naskh Arabic', serif;
        }

        .week-holiday-name {
            font-size: 10px;
            color: var(--accent);
            margin-top: 8px;
            font-weight: 600;
        }

        /* Yearly View */
        .yearly-view {
            display: none;
        }

        .year-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .month-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .month-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .month-card-header {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 15px;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--glass-border);
        }

        .month-card-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .mc-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mc-day:hover {
            background: rgba(192, 132, 252, 0.2);
        }

        .mc-day.today {
            background: var(--primary);
            color: white;
            font-weight: 700;
        }

        .mc-day.holiday {
            color: var(--accent);
            font-weight: 700;
        }

        .mc-day.other-month {
            opacity: 0.2;
        }

        /* Holiday List */
        .holiday-section {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            margin-top: 20px;
        }

        .holiday-section h3 {
            font-size: 18px;
            color: var(--primary);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .holiday-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .holiday-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border-left: 3px solid var(--accent);
            transition: all 0.3s ease;
        }

        .holiday-item:hover {
            background: rgba(244, 114, 182, 0.05);
            transform: translateX(5px);
        }

        .holiday-date {
            min-width: 80px;
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
        }

        .holiday-info {
            flex: 1;
        }

        .holiday-name {
            font-size: 14px;
            font-weight: 600;
        }

        .holiday-type {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 2px;
        }

        /* Install Button */
        .install-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 30px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 50px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(192, 132, 252, 0.4);
            transition: all 0.3s ease;
            z-index: 100;
            display: none;
        }

        .install-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 40px rgba(192, 132, 252, 0.5);
        }

        .install-btn.show {
            display: block;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Loading */
        .loading {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--darker);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-moon {
            font-size: 60px;
            color: var(--primary);
            animation: float 2s ease-in-out infinite;
        }

        .loading-text {
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-dim);
            letter-spacing: 4px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--darker);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        /* ==================== MOBILE FIXES ==================== */
        @media (max-width: 480px) {
            .app-container {
                padding: 10px;
            }

            .calendar-wrapper {
                padding: 12px;
                border-radius: 16px;
            }

            .weekdays {
                gap: 2px;
                margin-bottom: 6px;
            }

            .weekday {
                font-size: 9px;
                padding: 6px 1px;
                letter-spacing: 0;
            }

            .days-grid {
                gap: 2px;
            }

            .day-cell {
                border-radius: 8px;
                padding: 2px;
                min-height: 38px;
            }

            .day-num {
                font-size: 13px;
            }

            .day-sub,
            .day-sub.ar {
                font-size: 7px;
                margin-top: 1px;
            }

            .holiday-badge {
                width: 4px;
                height: 4px;
                top: 2px;
                right: 2px;
            }

            .calendar-header {
                margin-bottom: 10px;
            }

            .month-year {
                font-size: 16px;
            }

            .arrow-btn {
                width: 32px;
                height: 32px;
            }

            .nav-bar {
                gap: 6px;
                margin-bottom: 15px;
            }

            .nav-btn {
                padding: 8px 14px;
                font-size: 11px;
            }

            .date-display {
                padding: 12px;
                border-radius: 14px;
                margin-bottom: 15px;
            }

            .date-main {
                font-size: 16px;
            }

            .date-item .value {
                font-size: 13px;
            }

            .date-sub {
                gap: 12px;
            }

            .logo-text {
                font-size: 24px;
            }

            .logo-icon {
                font-size: 36px;
            }

            .year-selector {
                gap: 10px;
                margin-bottom: 15px;
            }

            .year-selector select {
                padding: 6px 12px;
                font-size: 14px;
            }

            .holiday-section {
                padding: 15px;
            }

            .holiday-name {
                font-size: 12px;
            }

            .holiday-date {
                font-size: 11px;
                min-width: 60px;
            }

            .week-row {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .year-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (min-width: 481px) and (max-width: 768px) {
            .app-container {
                padding: 15px;
            }

            .calendar-wrapper {
                padding: 18px;
            }

            .weekdays {
                gap: 4px;
            }

            .days-grid {
                gap: 4px;
            }

            .weekday {
                font-size: 10px;
                padding: 10px 3px;
            }

            .day-cell {
                border-radius: 10px;
                padding: 4px;
            }

            .day-num {
                font-size: 15px;
            }

            .day-sub,
            .day-sub.ar {
                font-size: 8px;
            }

            .week-row {
                grid-template-columns: repeat(7, 1fr);
                gap: 6px;
            }

            .week-day-card {
                padding: 12px 6px;
                border-radius: 14px;
            }

            .week-day-num {
                font-size: 20px;
            }

            .week-day-sub {
                font-size: 9px;
            }
        }

        @media (max-width: 360px) {
            .weekday {
                font-size: 8px;
                padding: 5px 0;
            }

            .day-num {
                font-size: 11px;
            }

            .day-sub,
            .day-sub.ar {
                font-size: 6px;
            }

            .nav-btn {
                padding: 6px 10px;
                font-size: 10px;
            }

            .calendar-wrapper {
                padding: 8px;
            }

            .day-cell {
                min-height: 32px;
                border-radius: 6px;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading" id="loading">
        <div class="loading-moon"><i class="fas fa-moon"></i></div>
        <div class="loading-text">CS CALENDAR</div>
        <div class="by-rafsan" style="margin-top:10px;">By Rafsan</div>
    </div>

    <!-- Background Effects -->
    <div class="stars" id="stars"></div>
    <div class="moon-glow"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-moon"></i></div>
                <div class="logo-text">CS</div>
                <div class="logo-sub">Calendar System</div>
                <div class="by-rafsan">By Rafsan</div>
            </div>
        </header>

        <!-- Year Selector -->
        <div class="year-selector">
            <button class="arrow-btn" onclick="changeYear(-1)"><i class="fas fa-chevron-left"></i></button>
            <select id="yearSelect" onchange="setYear(this.value)"></select>
            <button class="arrow-btn" onclick="changeYear(1)"><i class="fas fa-chevron-right"></i></button>
        </div>

        <!-- Navigation -->
        <nav class="nav-bar">
            <button class="nav-btn active" onclick="setView('monthly')"><i class="fas fa-calendar-alt"></i> Monthly</button>
            <button class="nav-btn" onclick="setView('weekly')"><i class="fas fa-calendar-week"></i> Weekly</button>
            <button class="nav-btn" onclick="setView('yearly')"><i class="fas fa-calendar"></i> Yearly</button>
        </nav>

        <!-- Date Display -->
        <div class="date-display">
            <div class="date-main" id="mainDate">Loading...</div>
            <div class="date-sub">
                <div class="date-item bangla">
                    <div class="label">Bangla</div>
                    <div class="value" id="banglaDate">-</div>
                </div>
                <div class="date-item">
                    <div class="label">Gregorian</div>
                    <div class="value" id="gregDate">-</div>
                </div>
                <div class="date-item arabic">
                    <div class="label">Hijri</div>
                    <div class="value" id="hijriDate">-</div>
                </div>
            </div>
        </div>

        <!-- Monthly View -->
        <div class="calendar-wrapper monthly-view" id="monthlyView">
            <div class="calendar-header">
                <div class="month-year" id="monthYear">Month Year</div>
                <div class="nav-arrows">
                    <button class="arrow-btn" onclick="changeMonth(-1)"><i class="fas fa-chevron-left"></i></button>
                    <button class="arrow-btn" onclick="goToToday()"><i class="fas fa-calendar-day"></i></button>
                    <button class="arrow-btn" onclick="changeMonth(1)"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
            <div class="weekdays" id="weekdays"></div>
            <div class="days-grid" id="daysGrid"></div>
        </div>

        <!-- Weekly View -->
        <div class="calendar-wrapper weekly-view" id="weeklyView">
            <div class="calendar-header">
                <div class="month-year" id="weekRange">Week Range</div>
                <div class="nav-arrows">

        // ==================== UTILITY FUNCTIONS ====================
        function toBanglaNumber(num) {
            return num.toString().split('').map(d => banglaNumerals[parseInt(d)] || d).join('');
        }

        function isLeapYear(year) {
            return (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
        }

        function gregorianToHijri(date) {
            const gd = date.getDate();
            const gm = date.getMonth() + 1;
            const gy = date.getFullYear();
            let jd;
            if ((gy > 1582) || ((gy === 1582) && (gm > 10)) || ((gy === 1582) && (gm === 10) && (gd > 14))) {
                jd = ((1461 * (gy + 4800 + ((gm - 14) / 12 | 0))) / 4 | 0) +
                     ((367 * (gm - 2 - 12 * ((gm - 14) / 12 | 0))) / 12 | 0) -
                     ((3 * (((gy + 4900 + ((gm - 14) / 12 | 0)) / 100) | 0)) / 4 | 0) +
                     gd - 32075;
            } else {
                jd = 367 * gy - ((7 * (gy + 5001 + ((gm - 9) / 7 | 0))) / 4 | 0) +
                     ((275 * gm) / 9 | 0) + gd + 1729777;
            }
            const l = jd - 1948440 + 10632;
            const n = ((l - 1) / 10631 | 0);
            const r = l - 10631 * n + 354;
            const j = (((r + 1) * 30) / 10607 | 0);
            const d = r - ((29 * j) / 29 | 0);
            const m = ((11 * j + 14) / 29 | 0);
            const y = 30 * n + j - 30;
            return { day: d, month: m, year: y };
        }

        function gregorianToBangla(date) {
            const gy = date.getFullYear();
            const gm = date.getMonth() + 1;
            const gd = date.getDate();
            let by, bm, bd;
            if (gm < 4 || (gm === 4 && gd < 14)) {
                by = gy - 594;
            } else {
                by = gy - 593;
            }
            const banglaMonthStart = [
                [4, 14], [5, 15], [6, 15], [7, 16], [8, 16], [9, 16],
                [10, 17], [11, 16], [12, 16], [1, 14], [2, 13], [3, 14]
            ];
            let found = false;
            for (let i = 0; i < 12; i++) {
                const [sm, sd] = banglaMonthStart[i];
                let startDate = new Date(gy, sm - 1, sd);
                if (sm === 1 || sm === 2 || sm === 3) {
                    startDate = new Date(gy + 1, sm - 1, sd);
                }
                let nextStart;
                if (i < 11) {
                    const [nsm, nsd] = banglaMonthStart[i + 1];
                    nextStart = new Date(gy, nsm - 1, nsd);
                    if (nsm === 1 || nsm === 2 || nsm === 3) {
                        nextStart = new Date(gy + 1, nsm - 1, nsd);
                    }
                } else {
                    nextStart = new Date(gy + 1, 4, 14);
                }
                if (date >= startDate && date < nextStart) {
                    bm = i;
                    bd = Math.floor((date - startDate) / (1000 * 60 * 60 * 24)) + 1;
                    found = true;
                    break;
                }
            }
            if (!found) {
                bm = 0;
                bd = 1;
            }
            return { day: bd, month: bm, year: by };
        }

        function getHoliday(date) {
            const m = date.getMonth() + 1;
            const d = date.getDate();
            const y = date.getFullYear();
            const key = `${m}-${d}`;
            const fullKey = `${y}-${m}-${d}`;
            const dayOfWeek = date.getDay();
            let result = [];
            if (dayOfWeek === 5) {
                result.push({ name: 'Weekly Holiday (Friday)', type: 'Weekly' });
            }
            if (holidays.annual[key]) {
                result = result.concat(holidays.annual[key]);
            }
            if (holidays.islamic[fullKey]) {
                result.push({ name: holidays.islamic[fullKey], type: 'Islamic' });
            }
            return result;
        }

        function isHoliday(date) {
            return getHoliday(date).length > 0;
        }

        function renderMonthly() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('monthYear').textContent = `${englishMonths[month]} ${year}`;
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();
            const grid = document.getElementById('daysGrid');
            grid.innerHTML = '';
            for (let i = firstDay - 1; i >= 0; i--) {
                const day = daysInPrevMonth - i;
                const cell = createDayCell(day, true);
                grid.appendChild(cell);
            }
            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(year, month, day);
                const isToday = date.toDateString() === today.toDateString();
                const holidayList = getHoliday(date);
                const isSelected = date.toDateString() === selectedDate.toDateString();
                const cell = createDayCell(day, false, isToday, holidayList, date, isSelected);
                grid.appendChild(cell);
            }
            const totalCells = grid.children.length;
            const remaining = 42 - totalCells;
            for (let day = 1; day <= remaining; day++) {
                const cell = createDayCell(day, true);
                grid.appendChild(cell);
            }
        }

        function createDayCell(day, otherMonth, isToday = false, holidays = [], date = null, isSelected = false) {
            const cell = document.createElement('div');
            cell.className = 'day-cell';
            if (otherMonth) cell.classList.add('other-month');
            if (isToday) cell.classList.add('today');
            if (holidays.length > 0) cell.classList.add('holiday');
            if (isSelected) cell.classList.add('selected');
            const num = document.createElement('div');
            num.className = 'day-num';
            num.textContent = day;
            cell.appendChild(num);
            if (date && !otherMonth) {
                const bangla = gregorianToBangla(date);
                const hijri = gregorianToHijri(date);
                const sub = document.createElement('div');
                sub.className = 'day-sub';
                sub.textContent = toBanglaNumber(bangla.day);
                cell.appendChild(sub);
                const subAr = document.createElement('div');
                subAr.className = 'day-sub ar';
                subAr.textContent = hijri.day;
                cell.appendChild(subAr);
                if (holidays.length > 0) {
                    const badge = document.createElement('div');
                    badge.className = 'holiday-badge';
                    cell.appendChild(badge);
                    cell.title = holidays.map(h => h.name).join(', ');
                }
                cell.onclick = () => {
                    selectedDate = new Date(date);
                    updateDateDisplay();
                    renderAll();
                };
            }
            return cell;
        }

        function renderWeekly() {
            const startOfWeek = new Date(currentDate);
            startOfWeek.setDate(currentDate.getDate() - currentDate.getDay());
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);
            document.getElementById('weekRange').textContent =
                `${englishMonths[startOfWeek.getMonth()]} ${startOfWeek.getDate()} - ${englishMonths[endOfWeek.getMonth()]} ${endOfWeek.getDate()}, ${endOfWeek.getFullYear()}`;
            const container = document.getElementById('weekRow');
            container.innerHTML = '';
            const today = new Date();
            for (let i = 0; i < 7; i++) {
                const date = new Date(startOfWeek);
                date.setDate(startOfWeek.getDate() + i);
                const isToday = date.toDateString() === today.toDateString();
                const holidays = getHoliday(date);
                const bangla = gregorianToBangla(date);
                const hijri = gregorianToHijri(date);
                const card = document.createElement('div');
                card.className = 'week-day-card';
                if (isToday) card.classList.add('today');
                if (holidays.length > 0) card.classList.add('holiday');
                card.innerHTML = `
                    <div class="week-day-name">${englishDays[i]}</div>
                    <div class="week-day-num">${date.getDate()}</div>
                    <div class="week-day-sub">${toBanglaNumber(bangla.day)} ${banglaMonths[bangla.month].substring(0,3)}</div>
                    <div class="week-day-sub ar">${hijri.day} ${hijriMonths[hijri.month].substring(0,3)}</div>
                    ${holidays.length > 0 ? `<div class="week-holiday-name">${holidays[0].name}</div>` : ''}
                `;
                card.onclick = () => {
                    selectedDate = new Date(date);
                    updateDateDisplay();
                };
                container.appendChild(card);
            }
        }

        function renderYearly() {
            const year = currentDate.getFullYear();
            const container = document.getElementById('yearGrid');
            container.innerHTML = '';
            for (let m = 0; m < 12; m++) {
                const card = document.createElement('div');
                card.className = 'month-card';
                const header = document.createElement('div');
                header.className = 'month-card-header';
                header.textContent = englishMonths[m];
                card.appendChild(header);
                const daysContainer = document.createElement('div');
                daysContainer.className = 'month-card-days';
                const firstDay = new Date(year, m, 1).getDay();
                const daysInMonth = new Date(year, m + 1, 0).getDate();
                const today = new Date();
                for (let i = 0; i < firstDay; i++) {
                    const empty = document.createElement('div');
                    empty.className = 'mc-day';
                    daysContainer.appendChild(empty);
                }
                for (let d = 1; d <= daysInMonth; d++) {
                    const date = new Date(year, m, d);
                    const dayEl = document.createElement('div');
                    dayEl.className = 'mc-day';
                    if (date.toDateString() === today.toDateString()) {
                        dayEl.classList.add('today');
                    }
                    if (isHoliday(date)) {
                        dayEl.classList.add('holiday');
                        dayEl.title = getHoliday(date).map(h => h.name).join(', ');
                    }
                    dayEl.textContent = d;
                    dayEl.onclick = () => {
                        currentDate = new Date(year, m, d);
                        selectedDate = new Date(year, m, d);
                        setView('monthly');
                        updateDateDisplay();
                    };
                    daysContainer.appendChild(dayEl);
                }
                card.appendChild(daysContainer);
                container.appendChild(card);
            }
        }

        function renderHolidays() {
            const container = document.getElementById('holidayList');
            container.innerHTML = '';
            const upcoming = [];
            const today = new Date();
            const endDate = new Date(today);
            endDate.setMonth(today.getMonth() + 3);
            for (let d = new Date(today); d <= endDate; d.setDate(d.getDate() + 1)) {
                const h = getHoliday(d);
                if (h.length > 0) {
                    h.forEach(hol => {
                        upcoming.push({
                            date: new Date(d),
                            name: hol.name,
                            type: hol.type
                        });
                    });
                }
            }
            upcoming.slice(0, 10).forEach(h => {
                const item = document.createElement('div');
                item.className = 'holiday-item';
                item.innerHTML = `
                    <div class="holiday-date">${h.date.getDate()} ${englishMonths[h.date.getMonth()].substring(0,3)}</div>
                    <div class="holiday-info">
                        <div class="holiday-name">${h.name}</div>
                        <div class="holiday-type">${h.type} Holiday • ${h.date.getFullYear()}</div>
                    </div>
                `;
                container.appendChild(item);
            });
            if (upcoming.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:var(--text-dim);padding:20px;">No upcoming holidays in the next 3 months</div>';
            }
        }

        function renderAll() {
            renderMonthly();
            renderWeekly();
            renderYearly();
            renderHolidays();
        }

        function setView(view) {
            currentView = view;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('monthlyView').style.display = view === 'monthly' ? 'block' : 'none';
            document.getElementById('weeklyView').style.display = view === 'weekly' ? 'block' : 'none';
            document.getElementById('yearlyView').style.display = view === 'yearly' ? 'block' : 'none';
            renderAll();
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            if (currentDate.getFullYear() < MIN_YEAR) currentDate.setFullYear(MIN_YEAR);
            if (currentDate.getFullYear() > MAX_YEAR) currentDate.setFullYear(MAX_YEAR);
            document.getElementById('yearSelect').value = currentDate.getFullYear();
            renderAll();
        }

        function changeWeek(delta) {
            currentDate.setDate(currentDate.getDate() + (delta * 7));
            if (currentDate.getFullYear() < MIN_YEAR) currentDate.setFullYear(MIN_YEAR);
            if (currentDate.getFullYear() > MAX_YEAR) currentDate.setFullYear(MAX_YEAR);
            document.getElementById('yearSelect').value = currentDate.getFullYear();
            renderAll();
        }

        function changeYear(delta) {
            currentDate.setFullYear(currentDate.getFullYear() + delta);
            if (currentDate.getFullYear() < MIN_YEAR) currentDate.setFullYear(MIN_YEAR);
            if (currentDate.getFullYear() > MAX_YEAR) currentDate.setFullYear(MAX_YEAR);
            document.getElementById('yearSelect').value = currentDate.getFullYear();
            renderAll();
        }

        function setYear(year) {
            currentDate.setFullYear(parseInt(year));
            renderAll();
        }

        function goToToday() {
            currentDate = new Date();
            selectedDate = new Date();
            document.getElementById('yearSelect').value = currentDate.getFullYear();
            updateDateDisplay();
            renderAll();
        }

        // ==================== PWA INSTALL ====================
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').classList.add('show');
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User installed the app');
                    }
                    deferredPrompt = null;
                    document.getElementById('installBtn').classList.remove('show');
                });
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.log('Service Worker registration failed'));
        }

        // ==================== INIT ====================
        window.addEventListener('DOMContentLoaded', () => {
            initStars();
            initYearSelect();
            renderWeekdays();
            updateDateDisplay();
            renderAll();
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 1500);
        });
    </script>
</body>
</html>
